<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111111" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Calendar" />
  <link rel="manifest" href="manifest.json" />
  <title>Task Calendar</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f5f5f5;
      color: #111;
      min-height: 100vh;
      padding: 1.5rem 2rem 3rem;
    }

    /* ── Top bar ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
    }

    .topbar-left h1 {
      font-size: 1.9rem;
      font-weight: 700;
      color: #111;
      letter-spacing: 0.04em;
    }

    .topbar-left .subtitle {
      font-size: 0.8rem;
      color: #777;
      margin-top: 0.15rem;
    }

    /* ── Search ── */
    .search-wrap {
      position: relative;
      flex: 1;
      max-width: 320px;
      margin: 0 1rem;
    }
    .search-wrap input {
      width: 100%;
      padding: 0.6rem 2.2rem 0.6rem 0.9rem;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 0.9rem;
      background: #fff;
      color: #111;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    .search-wrap input:focus { outline: none; border-color: #111; }
    .search-wrap input::placeholder { color: #aaa; }
    .search-clear {
      position: absolute;
      right: 0.6rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #aaa;
      font-size: 1.15rem;
      cursor: pointer;
      display: none;
      line-height: 1;
      padding: 0;
    }
    .search-clear:hover { color: #111; }

    /* ── Dropdown trigger ── */
    .dropdown-anchor { position: relative; }

    .open-btn {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 1.25rem;
      background: #111;
      border: none;
      border-radius: 9px;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .open-btn:hover { background: #333; }
    .open-btn .arrow { display: inline-block; transition: transform 0.2s; font-style: normal; }
    .open-btn.active .arrow { transform: rotate(180deg); }

    /* ── Dropdown panel ── */
    .dropdown-panel {
      position: absolute;
      top: calc(100% + 0.5rem);
      right: 0;
      width: 420px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 1.4rem;
      z-index: 200;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }
    .dropdown-panel.open { opacity: 1; transform: translateY(0); pointer-events: all; }
    .dropdown-panel h2 {
      font-size: 0.85rem; color: #555; text-transform: uppercase;
      letter-spacing: 0.08em; margin-bottom: 1rem;
    }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; margin-bottom: 0.7rem; }
    .form-row.single { grid-template-columns: 1fr; }

    label { display: block; font-size: 0.7rem; color: #777; margin-bottom: 0.2rem; text-transform: uppercase; letter-spacing: 0.06em; }

    input, textarea {
      width: 100%; background: #f5f5f5; border: 1px solid #ccc;
      border-radius: 8px; padding: 0.55rem 0.75rem; color: #111;
      font-size: 0.9rem; font-family: inherit; transition: border-color 0.2s;
    }
    input:focus, textarea:focus { outline: none; border-color: #111; }
    textarea { resize: vertical; min-height: 58px; }
    input[type="datetime-local"]::-webkit-calendar-picker-indicator { filter: none; }

    .add-btn {
      width: 100%; margin-top: 0; padding: 0; height: 38px; background: #111;
      border: none; border-radius: 8px; color: #fff; font-size: 0.95rem;
      font-weight: 600; cursor: pointer; transition: background 0.2s, transform 0.1s;
    }
    .add-btn:hover { background: #333; }
    .add-btn:active { transform: scale(0.98); }

    /* ── View tabs ── */
    .view-tabs {
      display: flex;
      gap: 0.4rem;
      margin-bottom: 1.5rem;
    }
    .tab-btn {
      padding: 0.45rem 1.1rem;
      border-radius: 7px;
      border: 1px solid #ccc;
      background: #fff;
      font-size: 0.88rem;
      font-weight: 600;
      color: #777;
      cursor: pointer;
      transition: all 0.15s;
    }
    .tab-btn.active { background: #111; color: #fff; border-color: #111; }
    .tab-btn:hover:not(.active) { background: #f0f0f0; }

    /* ────────────────────────────
       CALENDAR GRID
    ──────────────────────────── */
    .cal-view { display: none; }
    .cal-view.visible { display: block; }

    .cal-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }
    .cal-nav-btn {
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 7px;
      padding: 0.4rem 0.85rem;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .cal-nav-btn:hover { background: #f0f0f0; }

    .cal-month-label {
      font-size: 1.2rem;
      font-weight: 700;
      color: #111;
    }

    .cal-grid {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 12px;
      overflow: hidden;
    }

    .cal-dow-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border-bottom: 1px solid #ddd;
    }
    .cal-dow {
      text-align: center;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #999;
      padding: 0.6rem 0;
    }

    .cal-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }

    .cal-day {
      min-height: 100px;
      border-right: 1px solid #eee;
      border-bottom: 1px solid #eee;
      padding: 0.45rem 0.5rem;
      vertical-align: top;
      position: relative;
    }
    .cal-day:nth-child(7n) { border-right: none; }

    .cal-day.other-month .cal-day-num { color: #ccc; }

    .cal-day-num {
      font-size: 0.82rem;
      font-weight: 600;
      color: #555;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      margin-bottom: 0.3rem;
    }

    .cal-day.today .cal-day-num {
      background: #111;
      color: #fff;
    }

    /* task chip inside a day cell */
    .cal-chip {
      display: block;
      font-size: 0.72rem;
      font-weight: 600;
      background: #111;
      color: #fff;
      border-radius: 4px;
      padding: 0.15rem 0.4rem;
      margin-bottom: 0.2rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: default;
      max-width: 100%;
    }
    .cal-chip.done-chip    { background: #bbb; }
    .cal-chip.overdue-chip { background: #555; }
    .cal-chip.starred-chip { background: #333; }
    .cal-chip.dim-chip     { opacity: 0.2; }

    .cal-chip { position: relative; cursor: default; }
    #chip-tooltip {
      position: fixed;
      background: #222;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 500;
      border-radius: 6px;
      padding: 0.3rem 0.65rem;
      pointer-events: none;
      white-space: nowrap;
      z-index: 500;
      display: none;
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
    }

    /* ────────────────────────────
       LIST VIEW
    ──────────────────────────── */
    .list-view { display: none; }
    .list-view.visible { display: flex; flex-direction: column; gap: 0.7rem; }

    .section-label {
      font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em;
      color: #999; padding: 0.25rem 0; border-bottom: 1px solid #ddd; margin-bottom: 0.15rem;
    }

    .task-card {
      background: #fff; border: 1px solid #ddd; border-left: 5px solid #111;
      border-radius: 10px; padding: 1.1rem 1.5rem;
      display: grid; grid-template-columns: 1fr auto;
      gap: 0.5rem 1.5rem; align-items: start;
      transition: border-color 0.3s, background 0.3s;
    }
    .task-card.urgent  { border-left-color: #555; background: #f9f9f9; }
    .task-card.warning { border-left-color: #888; }
    .task-card.done    { border-left-color: #bbb; opacity: 0.5; }
    .task-card.overdue { border-left-color: #222; background: #f0f0f0; }

    .task-title { font-size: 1.15rem; font-weight: 600; color: #111; }
    .task-card.done .task-title { text-decoration: line-through; color: #aaa; }
    .task-desc { font-size: 0.88rem; color: #555; margin-top: 0.25rem; line-height: 1.4; }
    .task-due  { font-size: 0.78rem; color: #888; margin-top: 0.4rem; }

    .timer-block { text-align: right; min-width: 160px; }
    .timer-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.07em; color: #999; margin-bottom: 0.25rem; }
    .timer-display { font-family: 'Courier New', monospace; font-size: 1.35rem; font-weight: 700; color: #111; letter-spacing: 0.04em; }
    .task-card.urgent  .timer-display { color: #333; }
    .task-card.warning .timer-display { color: #555; }
    .task-card.done    .timer-display { color: #aaa; font-size: 1rem; }
    .task-card.overdue .timer-display { color: #000; }
    .timer-est { font-size: 0.68rem; color: #aaa; margin-top: 0.2rem; }

    .task-card { position: relative; }

    /* star badge — top-right corner of card */
    .star-badge {
      position: absolute;
      top: 0.3rem;
      right: 0.35rem;
      font-size: 1.1rem;
      line-height: 1;
      color: #f5c000;
      pointer-events: none;
    }

    .task-actions { grid-column: 1 / -1; display: flex; gap: 0.5rem; margin-top: 0.5rem; }
    .btn-done, .btn-delete, .btn-star {
      font-size: 0.78rem; padding: 0.35rem 0.85rem; border-radius: 6px;
      border: none; cursor: pointer; font-weight: 600; transition: background 0.15s;
    }
    .btn-done   { background: #111; color: #fff; }
    .btn-done:hover { background: #333; }
    .btn-delete { background: #fff; color: #555; border: 1px solid #ccc; }
    .btn-delete:hover { background: #f0f0f0; }
    .btn-star         { background: #fff; color: #111; border: 1px solid #ccc; }
    .btn-star:hover   { background: #f0f0f0; }
    .btn-star.starred { background: #111; color: #fff; border-color: #111; }
    .btn-edit  { background: #fff; color: #555; border: 1px solid #ccc; font-size: 0.78rem; padding: 0.35rem 0.85rem; border-radius: 6px; cursor: pointer; font-weight: 600; transition: background 0.15s; }
    .btn-edit:hover { background: #f0f0f0; }
    .btn-save  { background: #111; color: #fff; font-size: 0.78rem; padding: 0.35rem 0.85rem; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; }
    .btn-save:hover { background: #333; }
    .btn-cancel { background: #fff; color: #555; border: 1px solid #ccc; font-size: 0.78rem; padding: 0.35rem 0.85rem; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn-cancel:hover { background: #f0f0f0; }
    .edit-desc-ta {
      width: 100%; margin-top: 0.35rem; padding: 0.45rem 0.6rem;
      border: 1px solid #bbb; border-radius: 7px; font-family: inherit;
      font-size: 0.88rem; color: #111; resize: vertical; min-height: 54px;
      background: #f9f9f9;
    }
    .edit-desc-ta:focus { outline: none; border-color: #111; }

    .empty-state {
      text-align: center; color: #aaa; font-size: 0.95rem;
      padding: 3rem; border: 1px dashed #ccc; border-radius: 12px;
    }

    /* ── Day modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 300;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: #fff;
      border-radius: 14px;
      padding: 1.75rem;
      width: 480px;
      max-width: 95vw;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 16px 50px rgba(0,0,0,0.2);
      position: relative;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #111;
    }
    .modal-close {
      background: none;
      border: none;
      font-size: 1.4rem;
      color: #aaa;
      cursor: pointer;
      line-height: 1;
      padding: 0 0.2rem;
    }
    .modal-close:hover { color: #111; }

    .modal-task {
      border: 1px solid #ddd;
      border-left: 4px solid #111;
      border-radius: 8px;
      padding: 0.85rem 1rem;
      margin-bottom: 0.65rem;
    }
    .modal-task.done-task   { border-left-color: #bbb; opacity: 0.6; }
    .modal-task.overdue-task { border-left-color: #555; }

    .modal-task-name {
      font-size: 1rem;
      font-weight: 600;
      color: #111;
    }
    .modal-task { position: relative; }
    .modal-star-badge {
      position: absolute; top: 0.55rem; right: 0.75rem;
      font-size: 1rem; color: #f5c000; pointer-events: none;
    }
    .modal-task.done-task .modal-task-name { text-decoration: line-through; color: #aaa; }
    .modal-task-desc { font-size: 0.83rem; color: #555; margin-top: 0.2rem; }
    .modal-task-time { font-size: 0.75rem; color: #888; margin-top: 0.3rem; }
    .modal-task-timer {
      font-family: 'Courier New', monospace;
      font-size: 1rem;
      font-weight: 700;
      color: #111;
      margin-top: 0.35rem;
    }
    .modal-task.done-task .modal-task-timer   { color: #aaa; }
    .modal-task.overdue-task .modal-task-timer { color: #333; }

    .modal-empty {
      text-align: center;
      color: #bbb;
      font-size: 0.9rem;
      padding: 1.5rem 0;
    }

    /* ── Task card color swatch ── */
    .task-color-swatch {
      position: absolute;
      bottom: 0.5rem;
      right: 0.5rem;
      width: 20px;
      height: 20px;
      border-radius: 5px;
      border: 2px solid rgba(0,0,0,0.15);
      cursor: pointer;
      transition: transform 0.12s, border-color 0.12s;
      z-index: 1;
    }
    .task-color-swatch:hover { transform: scale(1.2); border-color: rgba(0,0,0,0.45); }

    #task-color-palette {
      position: fixed;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 0.55rem;
      display: none;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.35rem;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      z-index: 400;
    }
    #task-color-palette.open { display: grid; }

    /* ── Color picker ── */
    .color-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.4rem;
      height: 38px;
    }
    .color-picker-wrap { position: relative; flex-shrink: 0; }
    .color-swatch-btn {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      border: 2px solid #ccc;
      cursor: pointer;
      transition: border-color 0.15s;
      background: #111;
      flex-shrink: 0;
    }
    .color-swatch-btn:hover { border-color: #777; }
    .color-palette {
      position: absolute;
      bottom: calc(100% + 8px);
      right: 0;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 0.55rem;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.35rem;
      box-shadow: 0 6px 20px rgba(0,0,0,0.14);
      z-index: 250;
      opacity: 0;
      transform: translateY(6px);
      pointer-events: none;
      transition: opacity 0.15s, transform 0.15s;
    }
    .color-palette.open { opacity: 1; transform: translateY(0); pointer-events: all; }
    .color-dot {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.1s, border-color 0.1s;
    }
    .color-dot:hover { transform: scale(1.15); }
    .color-dot.selected { border-color: #111; }
  /* ── Mobile ── */
  @media (max-width: 640px) {
    body { padding: 1rem 0.75rem 2rem; }

    .topbar { flex-wrap: wrap; gap: 0.6rem; align-items: center; }
    .topbar-left { flex: 1; }
    .topbar-left h1 { font-size: 1.4rem; }
    .dropdown-anchor { order: 1; margin-left: auto; }
    .open-btn { padding: 0.55rem 1rem; font-size: 0.88rem; }
    .search-wrap { order: 2; width: 100%; max-width: 100%; margin: 0; display: flex; justify-content: center; }
    .search-wrap input { max-width: 320px; }

    .dropdown-panel {
      position: fixed;
      top: 60px;
      left: 0.75rem;
      right: 0.75rem;
      width: auto;
      max-height: calc(100vh - 80px);
      overflow-y: auto;
    }
    .form-row { grid-template-columns: 1fr; }

    .view-tabs { margin-bottom: 1rem; }

    .cal-day { min-height: 62px; padding: 0.3rem 0.35rem; }
    .cal-day-num { font-size: 0.72rem; width: 20px; height: 20px; }
    .cal-chip { font-size: 0.65rem; padding: 0.1rem 0.3rem; }
    .cal-dow { font-size: 0.62rem; padding: 0.4rem 0; }
    .cal-month-label { font-size: 1rem; }

    .task-card {
      grid-template-columns: 1fr;
      padding: 0.85rem 1rem;
    }
    .timer-block {
      text-align: left;
      min-width: unset;
      border-top: 1px solid #eee;
      padding-top: 0.5rem;
      margin-top: 0.25rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .timer-label { margin-bottom: 0; }
    .timer-display { font-size: 1.1rem; }
    .task-actions { flex-wrap: wrap; }

    .modal { padding: 1.1rem; width: 100%; border-radius: 10px; max-height: 85vh; }

    .star-badge { top: 0.25rem; right: 0.3rem; }
    .task-color-swatch { bottom: 0.35rem; right: 0.35rem; }

    #task-color-palette { position: fixed; bottom: 1rem; right: 1rem; top: auto; left: auto; }
  }

  /* ── Auth overlay ── */
  #auth-overlay {
    position: fixed; inset: 0; background: #f5f5f5;
    display: flex; align-items: center; justify-content: center; z-index: 9999;
  }
  #auth-card {
    background: #fff; border: 1px solid #ddd; border-radius: 14px;
    padding: 2rem; width: 360px; max-width: 92vw;
    box-shadow: 0 8px 30px rgba(0,0,0,0.1);
    display: flex; flex-direction: column; gap: 0.7rem;
  }
  #auth-card h2 { font-size: 1.6rem; font-weight: 700; text-align: center; margin-bottom: 0.25rem; }
  #auth-card input {
    width: 100%; padding: 0.65rem 0.85rem;
    border: 1px solid #ddd; border-radius: 8px; font-size: 0.95rem;
  }
  #auth-card input:focus { outline: none; border-color: #111; }
  .auth-btn {
    width: 100%; padding: 0.65rem; border: none; border-radius: 8px;
    font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: background 0.15s;
  }
  .auth-btn-primary   { background: #111; color: #fff; }
  .auth-btn-primary:hover { background: #333; }
  .auth-btn-secondary { background: #f0f0f0; color: #111; }
  .auth-btn-secondary:hover { background: #e0e0e0; }
  .auth-btn-google {
    background: #fff; color: #111; border: 1px solid #ddd;
    display: flex; align-items: center; justify-content: center; gap: 0.5rem;
  }
  .auth-btn-google:hover { background: #f7f7f7; }
  .auth-divider {
    text-align: center; color: #aaa; font-size: 0.82rem;
    display: flex; align-items: center; gap: 0.5rem;
  }
  .auth-divider::before, .auth-divider::after {
    content: ''; flex: 1; height: 1px; background: #e5e5e5;
  }
  #auth-error { color: #b03a2e; font-size: 0.83rem; text-align: center; min-height: 1rem; }
  #auth-toggle { text-align: center; font-size: 0.85rem; color: #555; margin-top: 0.1rem; }
  #auth-toggle a { color: #111; font-weight: 600; cursor: pointer; text-decoration: underline; }
  #auth-card p  { text-align: center; color: #666; font-size: 0.88rem; margin-top: -0.3rem; }

  /* ── User info in topbar ── */
  #user-info-wrap {
    display: flex; align-items: center; gap: 0.6rem; flex-shrink: 0;
  }
  #user-name { font-size: 0.82rem; color: #666; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .signout-btn {
    padding: 0.4rem 0.8rem; background: #f0f0f0; border: none;
    border-radius: 7px; font-size: 0.82rem; cursor: pointer;
  }
  .signout-btn:hover { background: #e0e0e0; }
  @media (max-width: 640px) {
    #user-name { display: none; }
    .signout-btn { padding: 0.35rem 0.65rem; font-size: 0.78rem; }
  }
  </style>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <div class="topbar-left">
    <h1>Calendar</h1>
  </div>

  <div class="search-wrap">
    <input type="text" id="search-input" placeholder="Search tasks…" oninput="onSearch()" />
    <button class="search-clear" id="search-clear" onclick="clearSearch()">&#x2715;</button>
  </div>

  <div id="user-info-wrap">
    <span id="user-name"></span>
    <button class="signout-btn" id="notif-toggle-btn" onclick="toggleNotifPref()" title="Toggle notifications">🔔</button>
    <button class="signout-btn" onclick="doSignOut()">Sign Out</button>
  </div>

  <div class="dropdown-anchor" id="dropdown-anchor">
    <button class="open-btn" id="open-btn" onclick="toggleDropdown()">
      + Add Task <i class="arrow">&#9660;</i>
    </button>
    <div class="dropdown-panel" id="dropdown-panel">
      <h2>New Task</h2>
      <div class="form-row">
        <div>
          <label for="task-name">Name</label>
          <input id="task-name" type="text" />
        </div>
        <div>
          <label for="task-due">Date &amp; Time</label>
          <input id="task-due" type="datetime-local" />
        </div>
      </div>
      <div class="form-row single">
        <div>
          <label for="task-desc">Description</label>
          <textarea id="task-desc" placeholder=""></textarea>
        </div>
      </div>
      <div class="color-row">
        <div class="color-picker-wrap" id="color-picker-wrap">
          <div class="color-swatch-btn" id="color-swatch-btn" onclick="toggleColorPicker(event)"></div>
          <div class="color-palette" id="color-palette"></div>
        </div>
        <button class="add-btn" onclick="addTask()">+ Add Task</button>
      </div>
    </div>
  </div>
</div>

<!-- View tabs -->
<div class="view-tabs">
  <button class="tab-btn active" id="tab-cal"  onclick="switchView('cal')">Calendar</button>
  <button class="tab-btn"        id="tab-list" onclick="switchView('list')">List</button>
</div>

<!-- Calendar view -->
<div class="cal-view visible" id="cal-view">
  <div class="cal-nav">
    <button class="cal-nav-btn" onclick="prevMonth()">&#8592;</button>
    <div class="cal-month-label" id="cal-month-label"></div>
    <button class="cal-nav-btn" onclick="nextMonth()">&#8594;</button>
  </div>
  <div class="cal-grid">
    <div class="cal-dow-row">
      <div class="cal-dow">Sun</div><div class="cal-dow">Mon</div>
      <div class="cal-dow">Tue</div><div class="cal-dow">Wed</div>
      <div class="cal-dow">Thu</div><div class="cal-dow">Fri</div>
      <div class="cal-dow">Sat</div>
    </div>
    <div class="cal-days" id="cal-days"></div>
  </div>
</div>

<!-- Day modal -->
<div class="modal-overlay" id="modal-overlay" onclick="handleOverlayClick(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title"></div>
      <button class="modal-close" onclick="closeModal()">&#x2715;</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<!-- Chip tooltip -->
<div id="chip-tooltip"></div>

<!-- Floating task color palette -->
<div id="task-color-palette"></div>

<!-- List view -->
<div class="list-view" id="list-view">
  <div class="empty-state" id="empty-msg">No tasks yet — click "Add Task" to get started.</div>
</div>

<!-- Auth overlay -->
<div id="auth-overlay">
  <div id="auth-card">
    <h2>Calendar</h2>
    <p>Sign in to sync your tasks across devices</p>
    <button class="auth-btn auth-btn-google" onclick="signInWithGoogle()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-4z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6 29.3 4 24 4c-7.7 0-14.4 4.3-17.7 10.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2A12 12 0 0124 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20H24v8h11.3a12 12 0 01-4.1 5.6l6.2 5.2C41 35.2 44 30 44 24c0-1.3-.1-2.7-.4-4z"/></svg>
      Sign in with Google
    </button>
    <div class="auth-divider">or</div>
    <input type="email" id="auth-email" placeholder="Email" />
    <input type="password" id="auth-password" placeholder="Password" onkeydown="if(event.key==='Enter')authSubmit()" />
    <input type="password" id="auth-confirm" placeholder="Confirm Password" style="display:none" onkeydown="if(event.key==='Enter')authSubmit()" />
    <div id="auth-error"></div>
    <button class="auth-btn auth-btn-primary" id="auth-submit-btn" onclick="authSubmit()">Sign In</button>
    <p id="auth-toggle">No account? <a onclick="switchAuthMode()">Create one</a></p>
    <div class="auth-divider">or</div>
    <button class="auth-btn auth-btn-secondary" onclick="continueAsGuest()">Continue as Guest</button>
  </div>
</div>

<script>
  let tasks    = [];
  let calYear  = new Date().getFullYear();
  let calMonth = new Date().getMonth(); // 0-based
  let curView  = 'cal';
  let searchQuery = '';

  /* ── Firebase ── */
  const firebaseConfig = {
    apiKey: "AIzaSyBFnn_dqs8F-L17INexJkHELtr8baxwvqk",
    authDomain: "calender-11950.firebaseapp.com",
    projectId: "calender-11950",
    storageBucket: "calender-11950.firebasestorage.app",
    messagingSenderId: "582941413139",
    appId: "1:582941413139:web:8dcf75655f746a14ba54e6"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db   = firebase.firestore();
  let currentUser      = null;
  let unsubscribeTasks = null;

  let isGuest = false;

  function save() {
    if (isGuest) { localStorage.setItem('cal-tasks', JSON.stringify(tasks)); return; }
    if (!currentUser) return;
    db.collection('users').doc(currentUser.uid).set({ tasks });
  }

  function continueAsGuest() {
    isGuest = true;
    tasks = JSON.parse(localStorage.getItem('cal-tasks') || '[]');
    document.getElementById('auth-overlay').style.display = 'none';
    document.getElementById('user-name').textContent = 'Guest';
    document.querySelector('.signout-btn').textContent = 'Sign In';
    renderAll();
    requestNotificationPermission();
  }

  function startTasksListener() {
    if (unsubscribeTasks) unsubscribeTasks();
    unsubscribeTasks = db.collection('users').doc(currentUser.uid)
      .onSnapshot(doc => {
        tasks = doc.exists ? (doc.data().tasks || []) : [];
        renderAll();
      });
  }

  let authMode = 'signin'; // 'signin' | 'create'

  function switchAuthMode() {
    authMode = authMode === 'signin' ? 'create' : 'signin';
    clearAuthError();
    const isCreate = authMode === 'create';
    document.getElementById('auth-confirm').style.display = isCreate ? '' : 'none';
    document.getElementById('auth-submit-btn').textContent = isCreate ? 'Create Account' : 'Sign In';
    document.getElementById('auth-toggle').innerHTML = isCreate
      ? 'Already have an account? <a onclick="switchAuthMode()">Sign in</a>'
      : 'No account? <a onclick="switchAuthMode()">Create one</a>';
    document.getElementById('auth-password').placeholder = isCreate ? 'Create Password' : 'Password';
  }

  function authSubmit() {
    clearAuthError();
    const email   = document.getElementById('auth-email').value.trim();
    const pass    = document.getElementById('auth-password').value;
    if (!email || !pass) { showAuthError({ message: 'Enter email and password.' }); return; }
    if (authMode === 'create') {
      const confirm = document.getElementById('auth-confirm').value;
      if (pass.length < 6) { showAuthError({ message: 'Password must be at least 6 characters.' }); return; }
      if (pass !== confirm) { showAuthError({ message: 'Passwords do not match.' }); return; }
      auth.createUserWithEmailAndPassword(email, pass).catch(showAuthError);
    } else {
      auth.signInWithEmailAndPassword(email, pass).catch(showAuthError);
    }
  }

  function signInWithGoogle() {
    clearAuthError();
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch(showAuthError);
  }

  function showAuthError(e) { document.getElementById('auth-error').textContent = e.message; }
  function clearAuthError()  { document.getElementById('auth-error').textContent = ''; }

  function doSignOut() {
    if (isGuest) {
      isGuest = false;
      tasks = [];
      document.getElementById('auth-overlay').style.display = 'flex';
      document.getElementById('user-name').textContent = '';
      document.querySelector('.signout-btn').textContent = 'Sign Out';
    } else {
      auth.signOut();
    }
  }

  auth.onAuthStateChanged(async user => {
    currentUser = user;
    if (user) {
      document.getElementById('auth-overlay').style.display = 'none';
      document.getElementById('user-name').textContent = user.displayName || user.email;
      // Migrate existing localStorage tasks on first login
      const local = JSON.parse(localStorage.getItem('cal-tasks') || '[]');
      if (local.length) {
        const ref = db.collection('users').doc(user.uid);
        const doc = await ref.get();
        if (!doc.exists || !(doc.data().tasks?.length)) {
          await ref.set({ tasks: local });
        }
        localStorage.removeItem('cal-tasks');
      }
      startTasksListener();
      requestNotificationPermission();
      updateNotifBtn();
    } else {
      document.getElementById('auth-overlay').style.display = 'flex';
      document.getElementById('user-name').textContent = '';
      if (unsubscribeTasks) { unsubscribeTasks(); unsubscribeTasks = null; }
      tasks = [];
      renderAll();
    }
  });

  function matches(t) {
    if (!searchQuery) return true;
    const q = searchQuery.toLowerCase();
    return t.name.toLowerCase().includes(q) || (t.desc && t.desc.toLowerCase().includes(q));
  }

  function updateSearchPlaceholder() {
    const input = document.getElementById('search-input');
    if (input) input.placeholder = window.innerWidth <= 640 ? 'Search...' : 'Search tasks…';
  }

  function onSearch() {
    searchQuery = document.getElementById('search-input').value.trim();
    document.getElementById('search-clear').style.display = searchQuery ? 'block' : 'none';

    if (searchQuery) {
      const first = tasks.filter(matches).sort((a, b) => a.dueMs - b.dueMs)[0];
      if (first) {
        const d = new Date(first.dueMs);
        calYear  = d.getFullYear();
        calMonth = d.getMonth();
      }
    }

    renderAll();
  }

  function clearSearch() {
    document.getElementById('search-input').value = '';
    searchQuery = '';
    document.getElementById('search-clear').style.display = 'none';
    renderAll();
  }

  /* ── Color picker ── */
  const PALETTE = [
    '#222222','#b03a2e','#ca6f1e','#b7950b',
    '#1e8449','#148f77','#1f618d','#6c3483'
  ];
  let selectedColor = '#222222';

  function initColorPicker() {
    const palette = document.getElementById('color-palette');
    PALETTE.forEach(hex => {
      const dot = document.createElement('div');
      dot.className = 'color-dot' + (hex === selectedColor ? ' selected' : '');
      dot.style.background = hex;
      dot.onclick = (e) => { e.stopPropagation(); pickColor(hex); };
      palette.appendChild(dot);
    });
    document.getElementById('color-swatch-btn').style.background = selectedColor;
  }

  function pickColor(hex) {
    selectedColor = hex;
    document.getElementById('color-swatch-btn').style.background = hex;
    document.querySelectorAll('.color-dot').forEach(d => {
      d.classList.toggle('selected', d.style.background === hexToRgb(hex) || d.style.background === hex);
    });
    document.getElementById('color-palette').classList.remove('open');
  }

  function hexToRgb(hex) {
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    return `rgb(${r}, ${g}, ${b})`;
  }

  function toggleColorPicker(e) {
    e.stopPropagation();
    document.getElementById('color-palette').classList.toggle('open');
  }

  document.addEventListener('click', (e) => {
    document.getElementById('color-palette').classList.remove('open');
    if (!document.getElementById('task-color-palette').contains(e.target)) {
      closeTaskColorPicker();
    }
  });

  /* ── Per-task color picker ── */
  let activeColorTaskId = null;

  function initTaskColorPalette() {
    const palette = document.getElementById('task-color-palette');
    PALETTE.forEach(hex => {
      const dot = document.createElement('div');
      dot.className = 'color-dot';
      dot.style.background = hex;
      dot.dataset.hex = hex;
      dot.onclick = (e) => { e.stopPropagation(); applyTaskColor(hex); };
      palette.appendChild(dot);
    });
  }

  function openTaskColorPicker(id, event) {
    event.stopPropagation();
    activeColorTaskId = id;
    const palette = document.getElementById('task-color-palette');

    // Mark selected color
    const task = tasks.find(t => t.id === id);
    palette.querySelectorAll('.color-dot').forEach(d => {
      d.classList.toggle('selected', d.dataset.hex === (task?.color || '#222222'));
    });

    // Position above the swatch
    palette.classList.add('open');
    const rect = event.currentTarget.getBoundingClientRect();
    const pw = palette.offsetWidth;
    const ph = palette.offsetHeight;
    palette.style.top  = (rect.top - ph - 6 + window.scrollY) + 'px';
    palette.style.left = (rect.right - pw + window.scrollX) + 'px';
  }

  function applyTaskColor(hex) {
    if (activeColorTaskId === null) return;
    const t = tasks.find(x => x.id === activeColorTaskId);
    if (t) { t.color = hex; save(); renderAll(); }
    closeTaskColorPicker();
    if (document.getElementById('modal-overlay').classList.contains('open')) refreshModal();
  }

  function closeTaskColorPicker() {
    document.getElementById('task-color-palette').classList.remove('open');
    activeColorTaskId = null;
  }

  /* ── View toggle ── */
  function switchView(v) {
    curView = v;
    document.getElementById('cal-view').classList.toggle('visible', v === 'cal');
    document.getElementById('list-view').classList.toggle('visible', v === 'list');
    document.getElementById('tab-cal').classList.toggle('active',  v === 'cal');
    document.getElementById('tab-list').classList.toggle('active', v === 'list');
    if (v === 'cal') renderCal();
    else renderList();
  }

  /* ── Dropdown ── */
  function toggleDropdown() {
    const panel = document.getElementById('dropdown-panel');
    const btn   = document.getElementById('open-btn');
    const open  = panel.classList.toggle('open');
    btn.classList.toggle('active', open);
  }
  document.addEventListener('click', e => {
    if (!document.getElementById('dropdown-anchor').contains(e.target)) {
      document.getElementById('dropdown-panel').classList.remove('open');
      document.getElementById('open-btn').classList.remove('active');
    }
  });

  /* ── Add task ── */
  function addTask() {
    const name = document.getElementById('task-name').value.trim();
    const due  = document.getElementById('task-due').value;
    const desc = document.getElementById('task-desc').value.trim();
    if (!name) { alert('Please enter a task name.'); return; }
    if (!due)  { alert('Please pick a due date and time.'); return; }
    tasks.push({ id: Date.now(), name, desc, dueMs: new Date(due).getTime(), done: false, doneAt: null, starred: false, color: selectedColor });
    save();
    document.getElementById('task-name').value = '';
    document.getElementById('task-due').value  = '';
    document.getElementById('task-desc').value = '';
    document.getElementById('dropdown-panel').classList.remove('open');
    document.getElementById('open-btn').classList.remove('active');
    renderAll();
  }

  function markDone(id) {
    const t = tasks.find(x => x.id === id);
    if (t) { t.done = true; t.doneAt = Date.now(); save(); renderAll(); }
  }

  function unmarkDone(id) {
    const t = tasks.find(x => x.id === id);
    if (t) { t.done = false; t.doneAt = null; save(); renderAll(); }
  }
  function deleteTask(id) {
    tasks = tasks.filter(x => x.id !== id);
    save(); renderAll();
  }

  function toggleStar(id) {
    const t = tasks.find(x => x.id === id);
    if (t) { t.starred = !t.starred; save(); renderAll(); }
  }

  function modalToggleStar(id) {
    const t = tasks.find(x => x.id === id);
    if (t) { t.starred = !t.starred; save(); renderAll(); }
    refreshModal();
  }

  /* ── Edit description ── */
  let editingTaskId = null;

  function startEditDesc(id) {
    editingTaskId = id;
    renderAll();
  }

  function saveEditDesc(id) {
    const ta = document.getElementById(`edit-desc-${id}`);
    const t  = tasks.find(x => x.id === id);
    if (t && ta) { t.desc = ta.value.trim(); save(); }
    editingTaskId = null;
    renderAll();
  }

  function cancelEditDesc() {
    editingTaskId = null;
    renderAll();
  }

  function modalStartEditDesc(id) {
    editingTaskId = id;
    refreshModal();
  }

  function modalSaveEditDesc(id) {
    const ta = document.getElementById(`edit-desc-${id}`);
    const t  = tasks.find(x => x.id === id);
    if (t && ta) { t.desc = ta.value.trim(); save(); renderAll(); }
    editingTaskId = null;
    refreshModal();
  }

  function modalCancelEditDesc() {
    editingTaskId = null;
    refreshModal();
  }

  /* ── Helpers ── */
  function toEST(ms) {
    return new Intl.DateTimeFormat('en-US', {
      timeZone: 'America/New_York',
      month: 'short', day: 'numeric',
      hour: 'numeric', minute: '2-digit', hour12: true
    }).format(new Date(ms));
  }

  function formatCountdown(ms) {
    if (ms <= 0) return null;
    const s = Math.floor(ms / 1000);
    const d = Math.floor(s / 86400);
    const h = Math.floor((s % 86400) / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    if (d > 0) return `${d}d ${String(h).padStart(2,'0')}h ${String(m).padStart(2,'0')}m ${String(sec).padStart(2,'0')}s`;
    if (h > 0) return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  }

  function urgencyClass(msLeft, done, dueMs) {
    if (done) return 'done';
    if (Date.now() > dueMs) return 'overdue';
    if (msLeft < 3600000)  return 'urgent';
    if (msLeft < 86400000) return 'warning';
    return '';
  }

  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ────────────────────────────
     CALENDAR RENDER
  ──────────────────────────── */
  function prevMonth() { calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } renderCal(); }
  function nextMonth() { calMonth++; if (calMonth > 11) { calMonth = 0;  calYear++; } renderCal(); }

  function renderCal() {
    const MONTHS = ['January','February','March','April','May','June',
                    'July','August','September','October','November','December'];
    document.getElementById('cal-month-label').textContent = `${MONTHS[calMonth]} ${calYear}`;

    const today    = new Date();
    const firstDay = new Date(calYear, calMonth, 1).getDay(); // 0=Sun
    const daysInMonth   = new Date(calYear, calMonth + 1, 0).getDate();
    const daysInPrevMonth = new Date(calYear, calMonth, 0).getDate();

    // Build a lookup: "YYYY-M-D" → [tasks]
    const taskMap = {};
    tasks.forEach(t => {
      const d = new Date(t.dueMs);
      const key = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
      (taskMap[key] = taskMap[key] || []).push(t);
    });

    const container = document.getElementById('cal-days');
    container.innerHTML = '';

    // Leading days from previous month
    for (let i = firstDay - 1; i >= 0; i--) {
      container.appendChild(makeCalDay(daysInPrevMonth - i, calMonth - 1, calYear, taskMap, true));
    }
    // Current month days
    for (let d = 1; d <= daysInMonth; d++) {
      container.appendChild(makeCalDay(d, calMonth, calYear, taskMap, false));
    }
    // Trailing days to fill grid (always end on a full row)
    const total = firstDay + daysInMonth;
    const trailing = total % 7 === 0 ? 0 : 7 - (total % 7);
    for (let d = 1; d <= trailing; d++) {
      container.appendChild(makeCalDay(d, calMonth + 1, calYear, taskMap, true));
    }
  }

  function makeCalDay(dayNum, month, year, taskMap, otherMonth) {
    let y = year, m = month;
    if (m < 0)  { m = 11; y--; }
    if (m > 11) { m = 0;  y++; }

    const key      = `${y}-${m}-${dayNum}`;
    const dayTasks = taskMap[key] || [];
    const today    = new Date();
    const isToday  = !otherMonth && dayNum === today.getDate() && m === today.getMonth() && y === today.getFullYear();

    const cell = document.createElement('div');
    cell.className = 'cal-day' + (otherMonth ? ' other-month' : '') + (isToday ? ' today' : '');
    cell.style.cursor = 'pointer';
    cell.addEventListener('click', () => openDayModal(dayNum, m, y, dayTasks));

    const numEl = document.createElement('div');
    numEl.className = 'cal-day-num';
    numEl.textContent = dayNum;
    cell.appendChild(numEl);

    dayTasks.forEach(t => {
      const now = Date.now();
      const chip = document.createElement('div');
      let chipCls = 'cal-chip';
      if (t.done)             chipCls += ' done-chip';
      else if (now > t.dueMs) chipCls += ' overdue-chip';
      if (t.starred) chipCls += ' starred-chip';
      if (searchQuery && !matches(t)) chipCls += ' dim-chip';
      chip.className = chipCls;
      chip.textContent = t.name;
      if (!t.done && t.color && !chipCls.includes('dim-chip')) chip.style.background = t.color;
      chip.addEventListener('mouseenter', (e) => {
        const tt = document.getElementById('chip-tooltip');
        const msLeft = t.dueMs - Date.now();
        tt.textContent = t.done ? 'Done' : (msLeft <= 0 ? 'Overdue' : (formatCountdown(msLeft) || '00:00'));
        tt.style.display = 'block';
        tt.style.left = (e.clientX + 10) + 'px';
        tt.style.top  = (e.clientY - 28) + 'px';
      });
      chip.addEventListener('mousemove', (e) => {
        const tt = document.getElementById('chip-tooltip');
        tt.style.left = (e.clientX + 10) + 'px';
        tt.style.top  = (e.clientY - 28) + 'px';
      });
      chip.addEventListener('mouseleave', () => {
        document.getElementById('chip-tooltip').style.display = 'none';
      });
      cell.appendChild(chip);
    });

    return cell;
  }

  /* ── Day modal ── */
  const MONTHS_LONG = ['January','February','March','April','May','June',
                       'July','August','September','October','November','December'];

  function openDayModal(day, month, year, dayTasks) {
    const modal = document.getElementById('modal');
    modal.dataset.day   = day;
    modal.dataset.month = month;
    modal.dataset.year  = year;
    document.getElementById('modal-title').textContent =
      `${MONTHS_LONG[month]} ${day}, ${year}`;

    const body = document.getElementById('modal-body');
    body.innerHTML = '';

    const sortedDay = [...dayTasks].sort((a, b) => {
      if (a.starred && !b.starred) return -1;
      if (!a.starred && b.starred) return 1;
      return a.dueMs - b.dueMs;
    });

    if (!sortedDay.length) {
      body.innerHTML = '<div class="modal-empty">No tasks due this day.</div>';
    } else {
      sortedDay.forEach(t => {
        const now    = Date.now();
        const msLeft = t.dueMs - now;
        let taskCls  = 'modal-task';
        if (t.done)             taskCls += ' done-task';
        else if (now > t.dueMs) taskCls += ' overdue-task';

        const timerVal = t.done ? 'Done' : (now > t.dueMs ? 'OVERDUE' : (formatCountdown(msLeft) || '00:00'));

        const timeStr = new Intl.DateTimeFormat('en-US', {
          timeZone: 'America/New_York',
          hour: 'numeric', minute: '2-digit', hour12: true
        }).format(new Date(t.dueMs));

        const el = document.createElement('div');
        el.className = taskCls;
        if (!t.done && t.color) el.style.borderLeftColor = t.color;
        const doneBtn    = t.done
          ? `<button class="btn-edit" onclick="modalUnmarkDone(${t.id})">Undo</button>`
          : `<button class="btn-done" onclick="modalMarkDone(${t.id})">Mark Done</button>`;
        const starCls    = t.starred ? 'btn-star starred' : 'btn-star';
        const isEditing  = editingTaskId === t.id;
        const descHtml   = isEditing
          ? `<textarea id="edit-desc-${t.id}" class="edit-desc-ta">${esc(t.desc || '')}</textarea>`
          : (t.desc ? `<div class="modal-task-desc">${esc(t.desc)}</div>` : '');
        const editActions = isEditing
          ? `<button class="btn-save" onclick="modalSaveEditDesc(${t.id})">Save</button>
             <button class="btn-cancel" onclick="modalCancelEditDesc()">Cancel</button>`
          : `<button class="btn-edit" onclick="modalStartEditDesc(${t.id})">Edit</button>`;
        el.innerHTML = `
          ${t.starred ? '<div class="modal-star-badge">★</div>' : ''}
          <div class="modal-task-name">${esc(t.name)}</div>
          ${descHtml}
          <div class="modal-task-time">${timeStr} EST</div>
          <div class="modal-task-timer" data-modal-timer="${t.id}">${timerVal}</div>
          <div class="task-actions" style="margin-top:0.5rem">
            ${doneBtn}
            <button class="${starCls}" onclick="modalToggleStar(${t.id})">Important</button>
            ${editActions}
            <div class="task-color-swatch" style="background:${t.color || '#222'};width:24px;height:24px;border-radius:5px;border:2px solid rgba(0,0,0,0.15);cursor:pointer;flex-shrink:0" onclick="openTaskColorPicker(${t.id}, event)"></div>
            <button class="btn-delete" onclick="modalDelete(${t.id})">Delete</button>
          </div>`;
        body.appendChild(el);
      });
    }

    document.getElementById('modal-overlay').classList.add('open');
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
  }

  function handleOverlayClick(e) {
    if (e.target === document.getElementById('modal-overlay')) closeModal();
  }

  function refreshModal() {
    const modal = document.getElementById('modal');
    const day   = +modal.dataset.day;
    const month = +modal.dataset.month;
    const year  = +modal.dataset.year;
    const dayTasks = tasks.filter(t => {
      const d = new Date(t.dueMs);
      return d.getFullYear() === year && d.getMonth() === month && d.getDate() === day;
    });
    openDayModal(day, month, year, dayTasks);
  }

  function modalMarkDone(id) {
    const t = tasks.find(x => x.id === id);
    if (t) { t.done = true; t.doneAt = Date.now(); save(); renderAll(); }
    refreshModal();
  }

  function modalUnmarkDone(id) {
    const t = tasks.find(x => x.id === id);
    if (t) { t.done = false; t.doneAt = null; save(); renderAll(); }
    refreshModal();
  }

  function modalDelete(id) {
    tasks = tasks.filter(x => x.id !== id);
    save(); renderAll();
    refreshModal();
  }

  /* ────────────────────────────
     LIST RENDER
  ──────────────────────────── */
  function renderList() {
    const list  = document.getElementById('list-view');
    const empty = document.getElementById('empty-msg');
    [...list.querySelectorAll('.task-card, .section-label')].forEach(el => el.remove());

    if (!tasks.length) { empty.style.display = ''; return; }
    empty.style.display = 'none';

    const now = Date.now();
    const byDue = (a, b) => a.dueMs - b.dueMs;

    const important = tasks.filter(t => !t.done && t.starred && matches(t)).sort(byDue);
    const upcoming  = tasks.filter(t => !t.done && !t.starred && now <= t.dueMs && matches(t)).sort(byDue);
    const overdue   = tasks.filter(t => !t.done && !t.starred && now > t.dueMs && matches(t)).sort(byDue);
    const done      = tasks.filter(t => t.done && matches(t)).sort(byDue);

    if (important.length) { appendLabel(list, 'Important'); important.forEach(t => list.appendChild(makeCard(t))); }
    if (upcoming.length)  { appendLabel(list, 'Upcoming');  upcoming.forEach(t => list.appendChild(makeCard(t))); }
    if (overdue.length)   { appendLabel(list, 'Overdue');   overdue.forEach(t => list.appendChild(makeCard(t))); }
    if (done.length)      { appendLabel(list, 'Completed'); done.forEach(t => list.appendChild(makeCard(t))); }
  }

  function appendLabel(parent, text) {
    const el = document.createElement('div');
    el.className = 'section-label';
    el.textContent = text;
    parent.appendChild(el);
  }

  function makeCard(t) {
    const now    = Date.now();
    const msLeft = t.dueMs - now;
    const cls    = urgencyClass(msLeft, t.done, t.dueMs);
    const card   = document.createElement('div');
    card.className = `task-card ${cls}`.trim();
    card.dataset.id = t.id;
    if (!t.done && t.color) card.style.borderLeftColor = t.color;

    const timerVal  = t.done ? 'Done' : (now > t.dueMs ? 'OVERDUE' : (formatCountdown(msLeft) || '00:00'));
    const timerLbl  = (t.done || now > t.dueMs) ? 'Status' : 'Time Left';
    const doneBtn   = t.done
      ? `<button class="btn-edit" onclick="unmarkDone(${t.id})">Undo</button>`
      : `<button class="btn-done" onclick="markDone(${t.id})">Mark Done</button>`;
    const starCls   = t.starred ? 'btn-star starred' : 'btn-star';
    const isEditing = editingTaskId === t.id;
    const descHtml  = isEditing
      ? `<textarea id="edit-desc-${t.id}" class="edit-desc-ta">${esc(t.desc || '')}</textarea>`
      : (t.desc ? `<div class="task-desc">${esc(t.desc)}</div>` : '');
    const editActions = isEditing
      ? `<button class="btn-save" onclick="saveEditDesc(${t.id})">Save</button>
         <button class="btn-cancel" onclick="cancelEditDesc()">Cancel</button>`
      : `<button class="btn-edit" onclick="startEditDesc(${t.id})">Edit</button>`;

    card.innerHTML = `
      ${t.starred ? '<div class="star-badge">★</div>' : ''}
      <div class="task-color-swatch" style="background:${t.color || '#222'}" onclick="openTaskColorPicker(${t.id}, event)"></div>
      <div>
        <div class="task-title">${esc(t.name)}</div>
        ${descHtml}
        <div class="task-due">${toEST(t.dueMs)} EST</div>
      </div>
      <div class="timer-block">
        <div class="timer-label">${timerLbl}</div>
        <div class="timer-display" data-timer="${t.id}">${timerVal}</div>
        <div class="timer-est">Eastern Time</div>
      </div>
      <div class="task-actions">
        ${doneBtn}
        <button class="${starCls}" onclick="toggleStar(${t.id})">Important</button>
        ${editActions}
        <button class="btn-delete" onclick="deleteTask(${t.id})">Delete</button>
      </div>`;
    return card;
  }

  function renderAll() {
    if (curView === 'cal') renderCal();
    else renderList();
  }

  /* ── Tick ── */
  let lastCls = {};
  function tick() {
    const now = Date.now();
    tasks.forEach(t => {
      const msLeft = t.dueMs - now;
      const cls    = urgencyClass(msLeft, t.done, t.dueMs);
      const countdown = (!t.done && now <= t.dueMs) ? (formatCountdown(msLeft) || '00:00') : null;

      // Update list timer
      const listEl = document.querySelector(`[data-timer="${t.id}"]`);
      if (listEl) {
        if (countdown) listEl.textContent = countdown;
        else if (!t.done) listEl.textContent = 'OVERDUE';
      }

      // Update modal timer if open
      const modalEl = document.querySelector(`[data-modal-timer="${t.id}"]`);
      if (modalEl) {
        if (countdown) modalEl.textContent = countdown;
        else if (!t.done) modalEl.textContent = 'OVERDUE';
      }


      if (lastCls[t.id] !== cls) { lastCls[t.id] = cls; renderAll(); }
    });
  }

  // Init
  initColorPicker();
  initTaskColorPalette();
  setInterval(tick, 1000);
  updateSearchPlaceholder();
  window.addEventListener('resize', updateSearchPlaceholder);

  /* ── PWA & Notifications ── */
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  let notifEnabled = localStorage.getItem('notif-enabled') !== 'false';

  function updateNotifBtn() {
    const btn = document.getElementById('notif-toggle-btn');
    if (!btn) return;
    btn.textContent = notifEnabled ? '🔔' : '🔕';
    btn.title = notifEnabled ? 'Notifications on' : 'Notifications off';
    btn.style.opacity = notifEnabled ? '1' : '0.5';
  }

  async function toggleNotifPref() {
    alert('Bell tapped! Permission: ' + (('Notification' in window) ? Notification.permission : 'not supported') + ' | notifEnabled: ' + notifEnabled);
    if (!notifEnabled) {
      if (Notification.permission === 'denied') {
        alert('Notifications are blocked. Enable them in your phone/browser settings first.'); return;
      }
      if (Notification.permission === 'default') await Notification.requestPermission();
      if (Notification.permission === 'granted') {
        notifEnabled = true;
        localStorage.setItem('notif-enabled', 'true');
        if (currentUser) subscribeToPush(currentUser.uid);
      }
    } else {
      notifEnabled = false;
      localStorage.setItem('notif-enabled', 'false');
    }
    updateNotifBtn();
  }

  const VAPID_PUBLIC_KEY = 'BNyDWAOTfqcm7S42xJIomVcKNmwVEcsMWvim1T0cvFrmdqdGxAwAI0AyZ-373FhXBIwlmOP_ADbRrOGCSdluMcI';

  function urlBase64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const raw = atob(base64);
    return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
  }

  async function subscribeToPush(uid) {
    if (!('serviceWorker' in navigator)) { alert('Push debug: no serviceWorker support'); return; }
    if (!('PushManager' in window)) { alert('Push debug: no PushManager support'); return; }
    try {
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
      const subJson = sub.toJSON();
      const ref = db.collection('users').doc(uid);
      const doc = await ref.get();
      const existing = doc.exists ? (doc.data().subscriptions || []) : [];
      const endpoint = subJson.endpoint;
      if (!existing.find(s => s.endpoint === endpoint)) {
        await ref.set({ subscriptions: [...existing, subJson] }, { merge: true });
        console.log('Push subscription saved to Firestore');
      } else {
        console.log('Push subscription already exists');
      }
    } catch (e) {
      console.error('subscribeToPush error:', e);
      alert('Push debug error: ' + e.name + ' — ' + e.message);
    }
  }

  async function requestNotificationPermission() {
    if (!('Notification' in window)) return;
    if (Notification.permission === 'default') {
      await Notification.requestPermission();
    }
    if (Notification.permission === 'granted' && currentUser) {
      subscribeToPush(currentUser.uid);
    }
    updateNotifBtn();
  }

  const notifiedSet = new Set();

  function sendNotification(title, body, tag) {
    if (navigator.serviceWorker?.controller) {
      navigator.serviceWorker.controller.postMessage({ type: 'NOTIFY', title, body, tag });
    } else if (Notification.permission === 'granted') {
      new Notification(title, { body });
    }
  }

  function checkNotifications() {
    if (!notifEnabled || !('Notification' in window) || Notification.permission !== 'granted') return;
    const now = Date.now();
    tasks.forEach(task => {
      if (task.done) return;
      const mins = (task.dueMs - now) / 60000;
      if (mins > 1439 && mins <= 1440 && !notifiedSet.has(task.id + '-1440')) {
        notifiedSet.add(task.id + '-1440');
        sendNotification(task.name, 'Due in 24 hours', 'task-' + task.id + '-1440');
      }
      if (mins > 59 && mins <= 60 && !notifiedSet.has(task.id + '-60')) {
        notifiedSet.add(task.id + '-60');
        sendNotification(task.name, 'Due in 1 hour', 'task-' + task.id + '-60');
      }
      if (mins > 14 && mins <= 15 && !notifiedSet.has(task.id + '-15')) {
        notifiedSet.add(task.id + '-15');
        sendNotification(task.name, 'Due in 15 minutes', 'task-' + task.id + '-15');
      }
      if (mins > -1 && mins <= 0 && !notifiedSet.has(task.id + '-0')) {
        notifiedSet.add(task.id + '-0');
        sendNotification(task.name + ' is due!', 'Task is now due', 'task-' + task.id + '-0');
      }
    });
  }

  setInterval(checkNotifications, 30000);
</script>
</body>
